<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Çağdaş Uçar</title>
  <desc id="desc">Header banner with a RAG pipeline motif: ingest, embed, retrieve, generate, verify, cite</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d0d7de" stroke-width="1" opacity="0.45"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="#ffffff"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="15.5" fill="none" stroke="#d0d7de"/>

  <!-- Text block -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="112" width="40" height="3" rx="1.5" fill="#0969da"/>
    <text x="68" y="186" font-size="76" font-weight="650" fill="#1f2328" letter-spacing="-1">Çağdaş Uçar</text>
  </g>

  <!-- Pipeline motif: ingest → embed → retrieve → generate → verify → cite -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#818b98">
    <path d="M884 70 V230" stroke="#d0d7de" stroke-width="2"/>
    <path d="M884 70 V198" stroke="#0969da" stroke-width="2" opacity="0.55"/>
    <g>
      <circle cx="884" cy="70" r="5" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
      <text x="904" y="75">ingest</text>
      <circle cx="884" cy="102" r="5" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
      <text x="904" y="107">embed</text>
      <circle cx="884" cy="134" r="5" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
      <text x="904" y="139">retrieve</text>
      <circle cx="884" cy="166" r="5" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
      <text x="904" y="171">generate</text>
      <circle cx="884" cy="198" r="5" fill="#0969da"/>
      <text x="904" y="203" fill="#1f2328">verify</text>
      <circle cx="884" cy="230" r="5" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
      <text x="904" y="235" fill="#1a7f37">cite</text>
    </g>
  </g>
</svg>
